# Default values for the Rancher Krateo blueprint.
# Values for the upstream Rancher chart are passed through the `rancher` key.
#
# PREREQUISITE: cert-manager is REQUIRED and must be installed separately, BEFORE this
# composition (see README), unless you terminate TLS externally with your own certificate
# (rancher.ingress.tls.source: secret). It is intentionally NOT bundled here: it cannot live
# in the same Helm release as Rancher, because Rancher renders an `Issuer` (cert-manager.io/v1)
# whose CRD must already exist at render time. This mirrors the official Rancher procedure.

# -- Rancher subchart (https://rancher.com).
# See https://ranchermanager.docs.rancher.com/getting-started/installation-and-upgrade/install-upgrade-on-a-kubernetes-cluster
rancher:
  # -- REQUIRED. Suffixes Rancher's fullname-derived resources (e.g. its cluster-admin
  # ClusterRoleBinding becomes "<release>-server"). Without this, Rancher's fullname collapses
  # to the bare Helm release name (because the release name contains "rancher"), which collides
  # with the release-named scaffolding RBAC that Krateo's chart-inspector creates while
  # enumerating the chart — making the install fail with "ClusterRoleBinding ... exists and
  # cannot be imported into the current release". Do not remove.
  nameOverride: server
  # -- Fully-qualified DNS name used to reach the Rancher UI/API. Must resolve to your ingress.
  hostname: rancher.example.com
  # -- Initial password for the local `admin` user. Change this and store it securely.
  bootstrapPassword: admin
  # -- Number of Rancher replicas. Use 3 for HA; set to 1 for single-node clusters (e.g. kind/minikube).
  replicas: 3
  ingress:
    tls:
      # -- Where the ingress certificate comes from: rancher (self-signed via cert-manager),
      # letsEncrypt (public certs via cert-manager) or secret (bring your own TLS secret).
      source: rancher
  # -- Let's Encrypt settings (only used when ingress.tls.source = letsEncrypt).
  letsEncrypt:
    email: ""
    ingress:
      class: nginx
  # -- Set to true when the certificate (rancher/secret source) is signed by a private CA.
  privateCA: false

# -- Krateo Composable Portal presentation for the composition.
portal:
  enabled: true
  card:
    icon: fa-solid fa-cow
  overview:
    enabled: true
    text: Rancher installation managed by Krateo.
  compositionstatus:
    enabled: true
  applicationstatus:
    enabled: false
  terminal:
    enabled: false
  events:
    enabled: true
  yamlviewer:
    enabled: true
  finops:
    enabled: false
