apiVersion: v2
# NOTE: the chart name becomes the Composition Kind (rancher-installer -> RancherInstaller).
# It MUST differ from the top-level values key of any wrapped subchart (here: `rancher`),
# otherwise crdgen produces a self-referential `spec.rancher.spec` and CRD generation fails.
name: rancher-installer
description: A Krateo blueprint that installs Rancher via the official Helm chart. Each Composition created from this blueprint acts as a self-contained Rancher installer. cert-manager is a prerequisite (see README) and is disabled by default.

# A chart can be either an 'application' or a 'library' chart.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/).
# NOTE: this drives the Composition CRD version (e.g. 0.1.0 -> v0-1-0).
version: CHART_VERSION

# This is the version of Rancher being deployed. Kept in sync with the rancher subchart below.
appVersion: "v2.14.2"

# The blueprint is an umbrella chart: it wraps the upstream Rancher chart and, optionally,
# cert-manager (a Rancher prerequisite). Subchart values are passed under the `rancher`
# and `cert-manager` keys in values.yaml.
dependencies:
  - name: cert-manager
    version: "v1.20.2"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled
  - name: rancher
    version: "2.14.2"
    repository: "https://releases.rancher.com/server-charts/stable"

home: https://krateo.io
icon: "https://github.com/krateoplatformops/krateo/blob/main/docs/media/logo.svg"
keywords:
  - rancher
  - cluster-management
  - installer
sources:
  - https://github.com/krateoplatformops-blueprints/rancher
annotations:
  krateoSupportedVersion: "2.7.0"
