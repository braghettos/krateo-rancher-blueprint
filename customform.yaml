apiVersion: v1
data:
  drawer: "true"
  form: "true"
  showFormStructure: "true"
  drawerSize: large
kind: ConfigMap
metadata:
  name: template-rancher-card
  namespace: cattle-system
---
apiVersion: templates.krateo.io/v1alpha1
kind: Widget
metadata:
  name: template-rancher-card
  namespace: cattle-system
spec:
  actions:
  - template:
      apiVersion: templates.krateo.io/v1alpha1
      name: template-rancher-customform
      namespace: cattle-system
      resource: customforms
      verb: GET
  - template:
      apiVersion: core.krateo.io/v1alpha1
      name: rancher
      namespace: cattle-system
      resource: compositiondefinitions
      verb: DELETE
  app:
    template:
      color: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | if .status == "False" then "orange" elif .status == "True" then "green" else "grey" end }
      content: Install Rancher via its official Helm chart.
      icon: fa-solid fa-cow
      tags: cattle-system,0.1.0
      title: rancher
      status: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | "Ready:" + .status }
      date: ${ .getCompositionDefinition.metadata.creationTimestamp }
  propsRef:
    name: template-rancher-card
    namespace: cattle-system
  type: card
  api:
  - name: getCompositionDefinition
    path: "/apis/core.krateo.io/v1alpha1/namespaces/cattle-system/compositiondefinitions/rancher"
    verb: GET
    headers:
    - 'Accept: application/json'
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: template-rancher-customform
  namespace: cattle-system
data:
  onSubmitId: submit
  onSubmitVerb: POST
  payloadFormKey: spec
  redirectRoute: /compositions/${metadata.namespace}/${metadata.name}
  redirectTimeout: "50"
---
apiVersion: templates.krateo.io/v1alpha1
kind: CustomForm
metadata:
  name: template-rancher-customform
  namespace: cattle-system
spec:
  type: customform
  propsRef:
    name: template-rancher-customform
    namespace: cattle-system
  actions:
    - template:
        id: submit
        apiVersion: composition.krateo.io/v0-1-0
        verb: POST
        resource: rancherinstallers
        payloadToOverride:
        - name: metadata.name
          value: ${ "rancher" }
        - name: metadata.namespace
          value: ${ "cattle-system" }
  app:
    template:
      schema: ${ .getCRD | .spec.versions[] | select(.name == "v0-1-0") | .schema.openAPIV3Schema.properties.spec }
      propertiesToHide:
      - portal
  api:
  - name: getCRD
    path: "/apis/apiextensions.k8s.io/v1/customresourcedefinitions/rancherinstallers.composition.krateo.io"
    verb: GET
    headers:
    - 'Accept: application/json'
