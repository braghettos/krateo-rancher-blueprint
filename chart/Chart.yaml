apiVersion: v2
# This blueprint is a FORK of the upstream Rancher Helm chart
# (https://releases.rancher.com/server-charts/stable, rancher 2.14.2).
#
# Why a fork instead of a dependency/umbrella wrapper:
#  - Krateo's core-provider builds the Composition CRD from this chart's values.schema.json
#    only (it never reads values.yaml). The upstream Rancher chart ships only a *partial*
#    values.schema.json (6 fields, and using constructs crdgen can't express: if/then,
#    type unions), so essential fields like `hostname` could not be set via a Composition.
#    This fork replaces it with a complete, crdgen-suitable schema (see values.schema.json).
#  - templates/service.yaml is patched to let you force the NodePort number
#    (service.httpNodePort / service.httpsNodePort).
#
# The chart name is `rancher-installer` (not `rancher`) on purpose: the resulting Kind is
# `RancherInstaller`, and the name avoids colliding with the release-named scaffolding RBAC that
# chart-inspector creates while enumerating the chart (which would otherwise clash with Rancher's
# own release-named cluster-admin ClusterRoleBinding).
#
# Updating Rancher = re-fork: replace templates/, scripts/, values.yaml from the new upstream
# version, re-apply the service.yaml NodePort patch, and reconcile values.schema.json.
name: rancher-installer
description: A Krateo blueprint that installs Rancher. It is a fork of the official Rancher Helm chart with a complete, crdgen-suitable values.schema.json so Compositions can configure the install. cert-manager is a required prerequisite and must be installed separately, beforehand (see README).
type: application

# Drives the Composition CRD version (e.g. 0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# Version of Rancher this fork tracks.
appVersion: "v2.14.2"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - rancher
  - cluster-management
  - installer
  - kubernetes
sources:
  - https://github.com/krateo-blueprints/krateo-rancher-blueprint
  - https://github.com/rancher/rancher
annotations:
  krateoSupportedVersion: "2.7.0"
  krateo.io/category: application
  krateo.io/maturity: stable
  krateo.io/display-name: Rancher Installer
